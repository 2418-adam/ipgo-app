<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e8e3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="입고">
<title>에이앤텍 입고</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="title">에이앤텍 입고</div>
  <div class="who" id="who"></div>
</header>
<nav class="tabs hide" id="tabs">
  <button id="tab_in" class="on">📷 입고</button>
  <button id="tab_dash">📊 현황</button>
</nav>

<!-- 처음 한 번: 비밀번호·이름 -->
<section id="login" class="hide">
  <div class="card">
    <h2>처음 한 번만 설정해요</h2>
    <label for="pin">회사 비밀번호</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div id="namebox" class="hide">
      <label for="name">내 이름</label>
      <select id="name"></select>
      <input id="name2" type="text" class="hide" placeholder="이름을 적어 주세요">
    </div>
    <button id="loginbtn" class="big">다음</button>
    <div class="msg" id="loginmsg"></div>
  </div>
</section>

<!-- 입고 화면 -->
<section id="main" class="hide">
  <div class="cam" id="cambox">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" class="hide"></canvas>
    <div class="aim"></div>
    <div class="camcount hide" id="camcount"><div class="n" id="camn"></div><div class="last" id="camlast"></div></div>
    <button id="camon" class="camon">📷 카메라 켜고 QR 찍기</button>
    <div class="flash" id="flash"></div>
  </div>
  <div class="hint" id="hint">QR에 카메라를 대기만 하면 "삑" 하고 아래에 쌓여요. 다 찍고 맨 아래 저장을 누르세요.</div>

  <div class="card">
    <label for="vendor">업체</label>
    <select id="vendor"></select>
    <div id="newvendor" class="hide">
      <input id="vendorname" type="text" placeholder="새 업체 이름">
      <button id="vendoradd" class="small">이 업체 등록</button>
    </div>
  </div>

  <div id="items"></div>
  <div class="empty" id="empty">아직 찍은 도면이 없어요</div>

  <!-- 방금 저장한 것 (몇 분 동안 되돌리기) -->
  <div class="card recent hide" id="recent">
    <div class="rchead"><h2 id="rc_title"></h2><button id="rc_close" class="x" aria-label="닫기">✕</button></div>
    <div class="state" id="rc_state"></div>
    <div id="rc_list"></div>
    <button id="rc_undo" class="undo">되돌리기 (저장 취소)</button>
    <div class="sub" id="rc_note"></div>
  </div>

  <details class="manual">
    <summary>QR이 안 찍히면 도번을 직접 넣기</summary>
    <div class="row">
      <input id="manual" type="text" placeholder="예: 26101-A001" autocapitalize="characters">
      <button id="manualadd" class="small">넣기</button>
    </div>
  </details>

  <div class="queue hide" id="queue"></div>
  <div class="foot">
    <a href="#" id="todaylink">오늘 저장한 것 보기</a> · <a href="#" id="logout">이름·비밀번호 바꾸기</a>
    <div class="ver" id="ver"></div>
  </div>
  <div class="spacer"></div>
</section>

<!-- 오늘 저장한 것 -->
<section id="today" class="hide">
  <div class="card">
    <h2>오늘 저장한 것</h2>
    <div id="todaylist"></div>
    <button id="todayback" class="big">돌아가기</button>
  </div>
</section>

<!-- 현황 (dash.js): 회사 PC가 30분마다 만드는 요약 자료 -->
<section id="dash" class="hide">
  <div class="dhead">
    <div class="dleft"><div class="dwhen" id="d_when">자료를 불러오는 중…</div><div class="dstate" id="d_state"></div></div>
    <button id="d_refresh" class="small">새로 고침</button>
  </div>
  <div class="nums" id="d_nums"></div>
  <div id="d_units"></div>
  <div class="card">
    <h3>가공품이 지금 있는 곳</h3>
    <div id="d_where"></div>
  </div>
  <div class="card">
    <h3>가공품 미입고 <span class="cnt" id="d_opencnt"></span></h3>
    <input id="d_find" type="search" placeholder="도번·파트명·업체·공정·상태로 찾기">
    <div id="d_open"></div>
    <button id="d_more" class="back hide">더 보기</button>
  </div>
  <div class="card hide" id="d_latebox">
    <h3>늦은 구매품</h3>
    <div id="d_late"></div>
  </div>
  <div class="card money" id="d_money"></div>
  <div class="foot">관리대장·공정_현황.xlsx·폰 입고 스캔·발주서에서 회사 PC가 30분마다 모은 것이에요. 적은 만큼만 정확해요.</div>
  <div class="spacer"></div>
</section>

<div class="savebar hide" id="savebar">
  <button id="save" class="big">저장</button>
</div>
<div class="toast hide" id="toast"></div>

<!-- 한 장 고치기 -->
<div class="sheet hide" id="sheet">
  <div class="card">
    <h2 id="sh_title"></h2>
    <div class="sub" id="sh_sub"></div>
    <label for="sh_work">작업</label>
    <select id="sh_work"></select>
    <label for="sh_kind">무엇을</label>
    <select id="sh_kind"><option>들어옴</option><option>보냄</option><option>불량</option></select>
    <label for="sh_qty">받은 수량</label>
    <input id="sh_qty" type="number" inputmode="numeric" min="0">
    <label for="sh_memo">메모 (불량 내용 등)</label>
    <input id="sh_memo" type="text">
    <button id="sh_ok" class="big">확인</button>
    <button id="sh_del" class="del">이 도면 빼기</button>
  </div>
</div>

<!-- 저장 전 확인 -->
<div class="sheet hide" id="confirm">
  <div class="card">
    <h2>이대로 저장할까요?</h2>
    <div class="sub" id="cf_sub"></div>
    <div id="cf_list"></div>
    <button id="cf_ok" class="big">이대로 저장</button>
    <button id="cf_back" class="back">돌아가서 고치기</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="dash.js"></script>
</body>
</html>
